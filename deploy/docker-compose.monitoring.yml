# v3.7 — stack giám sát LOCAL PILOT: n8n Community (lịch/workflow cảnh báo)
# + Uptime Kuma (uptime check). Chỉ chạy thử trên máy dev:
#   - cổng bind CHỈ 127.0.0.1 (không public ra LAN/Internet);
#   - KHÔNG mật khẩu/khóa mặc định: N8N_ENCRYPTION_KEY bắt buộc từ env
#     (thiếu → `docker compose config` báo lỗi); tài khoản owner n8n và
#     admin Uptime Kuma tạo ở lần mở UI đầu tiên, không seed;
#   - image PIN version (bump theo security advisory, không dùng latest).
# External-dep: production / Kuma trên VM runner riêng theo dõi URL
# production (/zalo-webhook HTTPS, Streamlit), workflow n8n gửi cảnh báo thật.
#
# Chạy:  docker compose --env-file .env -f deploy/docker-compose.monitoring.yml up -d
# Dừng:  docker compose --env-file .env -f deploy/docker-compose.monitoring.yml down
#        (thêm -v để xóa luôn volume dữ liệu)
name: samsam-monitoring

services:
  n8n:
    image: n8nio/n8n:2.4.0
    restart: "no"
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY (long random string) in env}
      N8N_HOST: 127.0.0.1
      N8N_PORT: "5678"
      N8N_SECURE_COOKIE: "false"  # chỉ vì local http://127.0.0.1 — production bật HTTPS
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: Asia/Ho_Chi_Minh
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - n8n_data:/home/node/.n8n

  uptime-kuma:
    image: louislam/uptime-kuma:1.23.17
    restart: "no"
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - kuma_data:/app/data

volumes:
  n8n_data:
  kuma_data:
